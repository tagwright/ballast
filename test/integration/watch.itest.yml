# Config for the live daemon watch integration test
# (test/integration/run-watch.sh). Same shape as ballast.itest.yml: no
# notifications, no telemetry, exec and stop stay at their
# default-disabled settings since this test exercises the socket-event
# watch -> discover -> schedule path, not any primitive that needs a gate.
#
# This file is committed; everything it points at outside itself (repos-
# watch/, secrets/) is generated by run-watch.sh and gitignored.

destinations:
  local:
    url: /repos

default_destination: local
secrets_dir: /run/ballast/secrets

# The standard Docker named-volume root is always included by default; this
# host only needs that default (confirmed via `docker info --format
# '{{.DockerRootDir}}'` in run-watch.sh), so no host_roots override here.
