# Config for the ballast.password-secret override integration test
# (test/integration/run-password-secret.sh). Same shape as ballast.itest.yml:
# one "local" destination, no notifications configured (falls back to
# beacon's built-in "log" channel).
#
# This file is committed; everything it points at outside itself
# (repos-password-secret/, restore-password-secret/,
# secrets-password-secret/) is generated by run-password-secret.sh and
# gitignored.

destinations:
  local:
    url: /repos

default_destination: local
secrets_dir: /run/ballast/secrets

# The standard Docker named-volume root is always included by default; this
# host only needs that default, same as ballast.itest.yml.
