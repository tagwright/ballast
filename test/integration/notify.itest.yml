# Config for the live notification delivery integration test
# (test/integration/run-notify.sh). Unlike every other *.itest.yml in this
# harness, this one DOES configure a notifications channel: the whole point
# of this test is proving config -> daemon.BuildNotifier ->
# orchestrator.reportOutcome -> beacon -> a real ntfy server actually
# receiving a message, which every other itest config deliberately avoids by
# leaving notifications unset (so beacon's built-in "log" fallback fires
# instead). "ballast-itest-ntfy" is a throwaway binwiederhier/ntfy server
# run-notify.sh starts on the ballast-itest-notify-net network; it needs no
# token for an unauthenticated topic.
#
# This file is committed; everything it points at outside itself (repos-
# notify/, secrets/) is generated by run-notify.sh and gitignored.

destinations:
  local:
    url: /repos

default_destination: local
secrets_dir: /run/ballast/secrets

notifications:
  - type: ntfy
    min_level: info
    settings:
      server: http://ballast-itest-ntfy
      topic: ballast-itest

# The standard Docker named-volume root is always included by default; this
# host only needs that default (confirmed via `docker info --format
# '{{.DockerRootDir}}'` in run-notify.sh), so no host_roots override here.
