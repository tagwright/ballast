# Config for the SFTP destination integration test
# (test/integration/run-sftp.sh). Proves an "sftp:user@host:path"
# destination URL -- restic's own native syntax, handed straight through by
# orchestrator.BuildRepo's joinRepoURL exactly like any other engine-native
# URL -- actually works end to end against a real SFTP server, including
# restic's own SSH-key-based auth and host-key handling (see run-sftp.sh
# for exactly what is and isn't proven about the latter).
#
# The destination host name below is the atmoz/sftp container's Docker DNS
# name on the ballast-itest-net user network run-sftp.sh creates and
# attaches both containers to. No destination "env" credentials are needed
# here (unlike the S3 destination): SFTP auth goes through restic's own
# execed "ssh" subprocess picking up the private key and host-checking
# policy from ~/.ssh/config inside the container, which run-sftp.sh mounts
# separately -- there is no credential to name as a Ballast secret for this
# backend.
#
# This file is committed; repos-sftp/ does not exist for this suite (unlike
# the local-filesystem suites) since the repository lives on the SFTP
# server's own ephemeral storage, not a host-mounted directory;
# restore-sftp/ is generated by run-sftp.sh and gitignored.

destinations:
  sftp:
    url: "sftp:sftpuser@ballast-itest-sftp:/upload/repos"

default_destination: sftp
secrets_dir: /run/ballast/secrets

# The standard Docker named-volume root is always included by default; this
# host only needs that default, same as ballast.itest.yml.
