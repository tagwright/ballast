# Config for the multiple-services / splay / concurrency integration test
# (test/integration/run-splay.sh). Same shape as hooks.itest.yml: this test
# uses ballast.exec.pre as an artificial delay to make concurrency
# observable, so BALLAST_ENABLE_EXEC is set on the daemon's own "docker run"
# (scoped to this one test), not baked in here.
#
# This file is committed; everything it points at outside itself (repos-
# splay/, secrets/, markers-splay/) is generated by run-splay.sh and
# gitignored.

destinations:
  local:
    url: /repos

default_destination: local
secrets_dir: /run/ballast/secrets

# The standard Docker named-volume root is always included by default; this
# host only needs that default (confirmed via `docker info --format
# '{{.DockerRootDir}}'` in run-splay.sh), so no host_roots override here.
