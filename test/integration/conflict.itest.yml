# Config for the ballast.*/tagwright.backup.* prefix-conflict integration
# test (test/integration/run-conflict.sh). Same shape as ballast.itest.yml:
# no notifications, no telemetry, exec and stop stay at their
# default-disabled settings.
#
# This file is committed; everything it points at outside itself (repos-
# conflict/, secrets/) is generated by run-conflict.sh and gitignored.

destinations:
  local:
    url: /repos

default_destination: local
secrets_dir: /run/ballast/secrets

# The standard Docker named-volume root is always included by default; this
# host only needs that default (confirmed via `docker info --format
# '{{.DockerRootDir}}'` in run-conflict.sh), so no host_roots override here.
