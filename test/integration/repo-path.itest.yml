# Config for the ballast.repo.path override integration test
# (test/integration/run-repo-path.sh). Same shape as ballast.itest.yml: one
# "local" destination, no notifications configured (falls back to beacon's
# built-in "log" channel).
#
# This file is committed; everything it points at outside itself
# (repos-repo-path/, restore-repo-path/) is generated by run-repo-path.sh
# and gitignored. Secrets are shared with the base run.sh suite
# (test/integration/secrets/), since this test needs nothing beyond the
# common repo-master-key.

destinations:
  local:
    url: /repos

default_destination: local
secrets_dir: /run/ballast/secrets

# The standard Docker named-volume root is always included by default; this
# host only needs that default, same as ballast.itest.yml.
