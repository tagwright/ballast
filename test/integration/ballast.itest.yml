# Config for the Ballast integration test harness (test/integration/run.sh).
#
# This file is committed; everything it points at outside itself (repos/,
# restore/, secrets/) is generated by run.sh and gitignored. Deliberately
# minimal: no notifications and no telemetry, so the notifier falls back to
# beacon's built-in "log" channel and needs no secrets at all; exec and stop
# stay at their default-disabled settings, so Ballast can never touch
# anything beyond the single ballast-itest-* container it is pointed at.

destinations:
  local:
    url: /repos

default_destination: local
secrets_dir: /run/ballast/secrets

# The standard Docker named-volume root (/var/lib/docker/volumes) is always
# included by default; this host only needs that default, confirmed via
# `docker info --format '{{.DockerRootDir}}'`. No host_roots override here.
