# Config for the S3 object-storage backend integration test
# (test/integration/run-s3.sh). Proves the identical restic S3 code path a
# real Cloudflare R2 destination uses, against a local MinIO standing in
# for R2 (both are plain S3-compatible endpoints; only the URL and
# credentials differ).
#
# This file is committed; everything it points at outside itself (repos-s3/,
# restore-s3/, secrets/) is generated by run-s3.sh and gitignored. The
# destination URL below names the MinIO container by its Docker DNS name on
# the ballast-itest-net user network run-s3.sh creates and attaches both the
# MinIO container and the ballast run containers to.

destinations:
  s3test:
    url: s3:http://ballast-itest-minio:9000/ballast-itest
    env:
      AWS_ACCESS_KEY_ID: r2-access-key-id
      AWS_SECRET_ACCESS_KEY: r2-secret-access-key

default_destination: s3test
secrets_dir: /run/ballast/secrets

# The standard Docker named-volume root is always included by default;
# run-s3.sh confirms it matches this host the same way run.sh does before
# relying on it.
