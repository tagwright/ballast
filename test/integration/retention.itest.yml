# Config for the retention/forget/prune/check integration test
# (test/integration/run-retention.sh). Same shape as ballast.itest.yml; kept
# as its own file so the retention harness's prune/check schedules (set via
# BALLAST_PRUNE_SCHEDULE/BALLAST_CHECK_SCHEDULE on the daemon container, not
# here) are visibly scoped to this test rather than silently changing the
# base harness config other scripts share.
#
# This file is committed; everything it points at outside itself (repos-
# retention/, secrets/) is generated by run-retention.sh and gitignored.

destinations:
  local:
    url: /repos

default_destination: local
secrets_dir: /run/ballast/secrets

# The standard Docker named-volume root (/var/lib/docker/volumes) is always
# included by default; this harness only needs that default, same as
# ballast.itest.yml. No host_roots override here.
