# Config for the Podman-adapter integration test harness
# (test/integration/run-podman.sh).
#
# This file is committed; everything it points at outside itself
# (repos-podman/, restore-podman/, secrets-podman/) is generated by
# run-podman.sh and gitignored. Deliberately minimal, same posture as
# ballast.itest.yml: no notifications and no telemetry, so the notifier
# falls back to beacon's built-in "log" channel and needs no secrets at
# all; exec and stop stay at their default-disabled settings.
#
# runtime/socket are NOT set here: run-podman.sh sets BALLAST_RUNTIME=podman
# and BALLAST_SOCKET on the ballast run containers directly, the same
# pattern splay.itest.yml uses for its own env-only gates, since the socket
# path is only known once the throwaway nested-Podman container's shared
# volume is mounted.

destinations:
  local:
    url: /repos

default_destination: local
secrets_dir: /run/ballast/secrets

# Podman's own named-volume data root is not /var/lib/docker/volumes (the
# only root config.applyDefaults seeds by default), so it must be added
# explicitly here. The nested Podman container used by this harness has its
# storage/volumes subtree bind-mounted from a Docker volume shared with the
# ballast:itest container at this exact path, so no path translation is
# needed: Source == the path Ballast itself can read.
host_roots:
  /var/lib/containers/storage/volumes: /var/lib/containers/storage/volumes
