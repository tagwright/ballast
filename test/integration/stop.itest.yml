# Config for the stop-for-consistency integration test
# (test/integration/run-stop.sh). Same shape as ballast.itest.yml, kept as
# its own file for the same reason stream.itest.yml and hooks.itest.yml are
# separate: a real deploy would enable BALLAST_ENABLE_STOP only where
# ballast.stop=true is actually used, so keeping this scoped to its own
# harness config keeps that visible rather than silently loosening the base
# run.sh config.
#
# This file is committed; everything it points at outside itself (repos-
# stop/, restore-stop/, secrets/) is generated by run-stop.sh and
# gitignored.

destinations:
  local:
    url: /repos

default_destination: local
secrets_dir: /run/ballast/secrets

# The standard Docker named-volume root is always included by default; this
# host only needs that default (confirmed via `docker info --format
# '{{.DockerRootDir}}'` in run-stop.sh), so no host_roots override here.
