# Config for the stream (exec-to-restic-stdin) integration test
# (test/integration/run-stream.sh). Same shape as ballast.itest.yml, but
# named separately since a real deploy would enable BALLAST_ENABLE_EXEC only
# where streams/hooks are actually used; keeping it a distinct file makes
# that scope visible rather than silently loosening the base harness config.
#
# This file is committed; everything it points at outside itself (repos/,
# restore/, secrets/) is generated by run-stream.sh and gitignored.

destinations:
  local:
    url: /repos

default_destination: local
secrets_dir: /run/ballast/secrets

# The standard Docker named-volume root is always included by default; this
# harness backs up no filesystem paths at all (ballast.volumes=none on both
# throwaway Postgres containers), so no host_roots override is needed here
# either.
