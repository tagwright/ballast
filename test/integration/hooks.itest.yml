# Config for the exec pre/post hook integration test
# (test/integration/run-hooks.sh). Same shape as stream.itest.yml, kept as
# its own file for the same reason: a real deploy would enable
# BALLAST_ENABLE_EXEC only where hooks/streams are actually used, so keeping
# this scoped to its own harness config keeps that visible rather than
# silently loosening the base run.sh config.
#
# This file is committed; everything it points at outside itself (repos-
# hooks/, restore-hooks/, secrets/) is generated by run-hooks.sh and
# gitignored.

destinations:
  local:
    url: /repos

default_destination: local
secrets_dir: /run/ballast/secrets

# The standard Docker named-volume root is always included by default; this
# host only needs that default (confirmed via `docker info --format
# '{{.DockerRootDir}}'` in run-hooks.sh), so no host_roots override here.
