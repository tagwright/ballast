name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # The load-bearing gate (tagwright Testing Standard, task #548): the release
  # runs the live harness itself, at the exact tag it is publishing, on the
  # self-hosted runner, and refuses to publish if it fails. It also asserts the
  # LAST-RUN operator attestation matches this tag. publish `needs` it, so a red
  # harness blocks the image from ever reaching GHCR.
  harness:
    runs-on: [self-hosted, tagwright, dind]
    env:
      GOPRIVATE: github.com/tagwright/*
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prove the isolated dind is reachable over TLS
        run: |
          docker version
          docker info

      - name: Run the live integration harness at the tag
        run: test/integration/run-all.sh

      - name: Verify LAST-RUN attests the operator-run bucket at this tag
        run: test/enforce/check-last-run.sh --release "${GITHUB_SHA}"

  publish:
    needs: harness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive the tag from the raw ref with the leading "v" stripped, NOT from a
      # semver pattern. ballast versions are zero-padded (v00.02.00) and carry
      # beta suffixes (v00.01.00b1); docker/metadata-action's semver pattern
      # treats those as non-semver and SILENTLY drops them, publishing only
      # :latest and no version tag. Stripping the ref keeps the published tag
      # byte-for-byte equal to VERSION.
      - name: Derive tag from ref
        id: vars
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tagwright/ballast
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
