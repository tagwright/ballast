# Example ballast.yml. Every field here is optional; an empty or missing
# file is valid, and any scalar global default below can also be set (or
# overridden) via a BALLAST_* environment variable instead. Nothing in this
# file is ever a literal secret: destination env values and channel/sink
# settings that hold credentials are secret NAMES, resolved at runtime from
# /run/ballast/secrets/<name> (or a BALLAST_SECRET_<NAME> env var).

# Named backup destinations. A service selects one by name via its
# ballast.repo label; default_destination below picks one when a service
# sets no label at all.
destinations:
  local:
    # Engine-native repository location. restic syntax lives here,
    # deliberately kept out of the label grammar.
    url: /repos

  r2:
    url: s3:https://<account-id>.r2.cloudflarestorage.com/ballast-backups
    # Maps the env var name restic's child process needs to a secret name,
    # never to the credential itself.
    env:
      AWS_ACCESS_KEY_ID: r2-access-key-id
      AWS_SECRET_ACCESS_KEY: r2-secret-access-key

# Destination used when a service sets no ballast.repo label.
default_destination: local

# Global defaults. Any of these can be overridden per service by the
# matching ballast.* label, and any of them can be overridden here (or
# supplied with no file at all) by the matching BALLAST_* env var.
schedule: "@daily"
# Compact "key=value,key=value" form: last, hourly, daily, weekly, monthly,
# yearly (integers), within (a restic duration, e.g. "30d"), and keep-tags.
# This is the value applied when a service sets no ballast.retention.*
# labels at all; a service that labels any retention dimension replaces
# this wholesale rather than merging with it. Shown here at its own
# built-in default, daily=7,weekly=4,monthly=6.
retention: "daily=7,weekly=4,monthly=6"
secrets_dir: /run/ballast/secrets
concurrency: 1

# Container runtime Ballast talks to: "docker" (the default) or "podman",
# both over a Docker Engine API-compatible socket. Overridable by
# BALLAST_RUNTIME. See the Podman section of README.md.
# runtime: docker

# API socket path for whichever runtime above is selected. Overridable by
# BALLAST_SOCKET. Left unset, Ballast resolves the engine's own
# conventional default (DOCKER_HOST/CONTAINER_HOST if set, otherwise
# /var/run/docker.sock for docker or the rootless/rootful podman.sock path
# for podman).
# socket: /var/run/docker.sock

# Host-side path prefixes Ballast has mounted, mapped to the path they
# appear under inside the Ballast container, so a bind-mount's host source
# (from container inspection) can be resolved to a path Ballast can read.
#
# The standard Docker named-volume root, /var/lib/docker/volumes, is
# ALWAYS included automatically and does not need an entry here: as long
# as the recommended deploy mounts that same path read-only into the
# Ballast container (see README.md), named volumes just work. host_roots
# is only needed for extra bind-mount roots outside that standard layout,
# merged on top of the automatic default rather than replacing it.
#
# host_roots:
#   /srv/binds: /srv/binds

# Alert channels. Each fires on the orchestrator's outcome per its
# min_level. Settings that are credentials are secret names, never literal
# tokens or URLs with embedded auth.
notifications:
  - type: ntfy
    min_level: warn
    settings:
      topic: ballast-alerts
      # Secret name, resolved at runtime, not a literal ntfy access token.
      # Optional: omit for an unauthenticated topic.
      token_secret: ntfy-ballast-token

  - type: discord
    min_level: error
    settings:
      # Secret name naming a Discord webhook URL, not the URL itself.
      webhook_secret: discord-ballast-webhook

# Health and status push sinks, separate from the alert channels above.
telemetry:
  - type: gatus
    settings:
      # Literal base URL of the Gatus instance, no embedded auth.
      url: https://status.example.com
      # Literal external-endpoint key registered on that Gatus instance.
      endpoint_key: ballast-backup
      # Optional secret name for the push token, omit if the endpoint is open.
      # token_secret: gatus-ballast-push-token
